<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful — London & UK Planner</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="header" id="site-header"></header>

  <main class="main">
    <section class="section" style="min-height: 60vh; display: flex; align-items: center;">
      <div class="container" style="text-align: center;">
        <div style="font-size: 4rem; margin-bottom: 1rem;">🎉</div>
        <h1>Payment Successful!</h1>
        <div class="divider"></div>
        <p style="font-size: 1.15rem; color: var(--color-text-muted); max-width: 500px; margin: 0 auto 2rem;">
          Your full London itinerary is now unlocked. You can download it as a PDF, view the interactive map, and access all booking links and insider tips.
        </p>
        <a href="itinerary.html" class="btn btn--primary btn--large">View My Itinerary</a>
        <p style="font-size: 0.85rem; color: var(--color-text-muted); margin-top: 2rem;">
          Redirecting automatically in <span id="countdown">5</span> seconds...
        </p>
      </div>
    </section>
  </main>

  <footer class="footer" id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/payment.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      UI.init();

      // Process payment success
      Payment.handleSuccess();

      // Countdown and redirect
      let count = 5;
      const el = document.getElementById('countdown');
      const timer = setInterval(() => {
        count--;
        el.textContent = count;
        if (count <= 0) {
          clearInterval(timer);
          window.location.href = 'itinerary.html';
        }
      }, 1000);
    });
  </script>
</body>
</html>
