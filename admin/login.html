<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — London Planned</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .login-card { width: 100%; max-width: 420px; background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding: 2.5rem; }
    .login-card h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
    .login-card .subtitle { color: var(--color-text-muted); font-size: 0.9rem; margin-bottom: 1.75rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--color-text-muted); }
    .field input { width: 100%; padding: 0.7rem 0.85rem; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: 0.95rem; }
    .field input:focus { outline: none; border-color: var(--color-accent); }
    .login-btn { width: 100%; padding: 0.85rem; margin-top: 0.5rem; font-size: 0.95rem; }
    .error { color: #b00; font-size: 0.85rem; margin-top: 0.75rem; min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="login-form">
      <h1>Admin login</h1>
      <p class="subtitle">London Planned · Listings review</p>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn--primary login-btn" id="submit-btn">Sign in</button>
      <div class="error" id="error"></div>
    </form>
  </div>
  <script>
    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorBox = document.getElementById('error');

    // If already signed in, bounce straight to listings.
    fetch('/.netlify/functions/auth-me', { credentials: 'same-origin' })
      .then((r) => { if (r.ok) window.location.href = '/admin/listings.html'; })
      .catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';
      try {
        const res = await fetch('/.netlify/functions/auth-login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          errorBox.textContent = data.error || 'Sign-in failed.';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign in';
          return;
        }
        window.location.href = '/admin/listings.html';
      } catch (err) {
        errorBox.textContent = 'Network error — try again.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
