<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day Trips from London — London & UK Planner</title>
  <meta name="description" content="15 best day trips from London: Stonehenge, Windsor Castle, Oxford, Cambridge, Brighton, Bath, and more. Travel times, costs, and booking links.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .day-trips-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }
    .day-trip-card {
      background: var(--color-surface, #fff);
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .day-trip-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    .day-trip-card__header {
      background: var(--color-primary, #1a365d);
      color: white;
      padding: 1.25rem 1.5rem;
    }
    .day-trip-card__header h3 {
      margin: 0;
      font-size: 1.25rem;
      font-family: 'Playfair Display', serif;
    }
    .day-trip-card__body {
      padding: 1.5rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .day-trip-card__description {
      color: var(--color-text, #333);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1rem;
    }
    .day-trip-card__meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
    }
    .day-trip-card__meta-item {
      background: var(--color-bg-alt, #f7f7f7);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      color: var(--color-text-muted, #666);
    }
    .day-trip-card__highlights {
      list-style: none;
      padding: 0;
      margin: 0 0 1rem 0;
    }
    .day-trip-card__highlights li {
      padding: 0.25rem 0;
      font-size: 0.9rem;
      color: var(--color-text, #333);
    }
    .day-trip-card__highlights li::before {
      content: "\2713 ";
      color: var(--color-primary, #1a365d);
      font-weight: 700;
      margin-right: 0.35rem;
    }
    .day-trip-card__tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }
    .day-trip-card__tag {
      background: var(--color-primary-light, #e8edf4);
      color: var(--color-primary, #1a365d);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      text-transform: capitalize;
    }
    .day-trip-card__tip {
      background: #fffbeb;
      border-left: 3px solid #f59e0b;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      color: #92400e;
      border-radius: 0 6px 6px 0;
      margin-bottom: 1rem;
    }
    .day-trip-card__cost {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--color-text, #333);
      margin-bottom: 1rem;
    }
    .day-trip-card__footer {
      margin-top: auto;
      padding-top: 1rem;
    }
    .day-trip-card__footer .btn {
      width: 100%;
      text-align: center;
    }
    .day-trips-loading {
      text-align: center;
      padding: 3rem;
      color: var(--color-text-muted, #999);
    }
    .day-trip-filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1.5rem;
    }
    .day-trip-filter-bar button {
      background: var(--color-bg-alt, #f0f0f0);
      border: 1px solid var(--color-border, #ddd);
      color: var(--color-text, #333);
      padding: 0.4rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background 0.2s, color 0.2s;
    }
    .day-trip-filter-bar button.active,
    .day-trip-filter-bar button:hover {
      background: var(--color-primary, #1a365d);
      color: white;
      border-color: var(--color-primary, #1a365d);
    }
    @media (max-width: 600px) {
      .day-trips-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="header" id="site-header"></header>
  <main class="main">
    <section class="section section--dark" style="text-align:center;padding:4rem 0;">
      <div class="container">
        <h1 style="color:white;">Day Trips from London</h1>
        <div class="divider"></div>
        <p style="color:rgba(255,255,255,0.8);max-width:640px;margin:0 auto;">Escape the city for a day — castles, cliffs, ancient universities, and seaside towns all within easy reach by train</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="day-trip-filter-bar" id="filter-bar"></div>
        <div class="day-trips-grid" id="day-trips-grid">
          <div class="day-trips-loading">Loading day trips...</div>
        </div>
      </div>
    </section>

    <section class="section" style="text-align:center;padding-bottom:3rem;">
      <div class="container">
        <a href="wizard.html" class="btn btn--primary btn--large">Plan My Full Trip</a>
      </div>
    </section>
  </main>
  <footer class="footer" id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/env-bridge.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/analytics.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      UI.init();

      let allTrips = [];

      fetch('data/day-trips.json')
        .then(r => r.json())
        .then(trips => {
          allTrips = trips;
          injectStructuredData(trips);
          renderFilters(trips);
          renderTrips(trips);
        })
        .catch(() => {
          document.getElementById('day-trips-grid').innerHTML =
            '<p style="text-align:center;color:var(--color-text-muted);">Unable to load day trips. Please refresh the page.</p>';
        });

      function renderFilters(trips) {
        const tagSet = new Set();
        trips.forEach(t => t.bestFor.forEach(b => tagSet.add(b)));
        const tags = Array.from(tagSet).sort();
        const bar = document.getElementById('filter-bar');
        bar.innerHTML = '<button class="active" data-filter="all">All Trips</button>' +
          tags.map(t => `<button data-filter="${t}">${t}</button>`).join('');

        bar.addEventListener('click', e => {
          if (!e.target.matches('button')) return;
          bar.querySelectorAll('button').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          const filter = e.target.dataset.filter;
          if (filter === 'all') {
            renderTrips(allTrips);
          } else {
            renderTrips(allTrips.filter(t => t.bestFor.includes(filter)));
          }
        });
      }

      function renderTrips(trips) {
        const grid = document.getElementById('day-trips-grid');
        if (!trips.length) {
          grid.innerHTML = '<p style="text-align:center;color:var(--color-text-muted);grid-column:1/-1;">No trips match this filter.</p>';
          return;
        }
        grid.innerHTML = trips.map(trip => `
          <div class="day-trip-card" id="${trip.id}">
            <div class="day-trip-card__header">
              <h3>${trip.name}</h3>
            </div>
            <div class="day-trip-card__body">
              <p class="day-trip-card__description">${trip.description}</p>
              <div class="day-trip-card__meta">
                <span class="day-trip-card__meta-item">${trip.distance}</span>
                <span class="day-trip-card__meta-item">${trip.travelTime}</span>
                <span class="day-trip-card__meta-item">From ${trip.travelFrom}</span>
                <span class="day-trip-card__meta-item">Train ~&pound;${trip.travelCost}</span>
              </div>
              <ul class="day-trip-card__highlights">
                ${trip.highlights.map(h => `<li>${h}</li>`).join('')}
              </ul>
              <div class="day-trip-card__tags">
                ${trip.bestFor.map(b => `<span class="day-trip-card__tag">${b}</span>`).join('')}
              </div>
              <div class="day-trip-card__tip">${trip.tips}</div>
              <div class="day-trip-card__cost">Estimated day cost: ~&pound;${trip.estimatedDayCost} per person</div>
              <div class="day-trip-card__footer">
                <a href="${trip.bookingUrl}" target="_blank" rel="noopener noreferrer" class="btn btn--primary">${trip.bookingLabel}</a>
              </div>
            </div>
          </div>
        `).join('');
      }

      function injectStructuredData(trips) {
        const schema = trips.map(trip => ({
          "@context": "https://schema.org",
          "@type": "TouristTrip",
          "name": trip.name,
          "description": trip.description,
          "touristType": trip.bestFor,
          "offers": {
            "@type": "Offer",
            "price": trip.estimatedDayCost,
            "priceCurrency": "GBP",
            "url": trip.bookingUrl
          },
          "itinerary": {
            "@type": "ItemList",
            "itemListElement": trip.highlights.map((h, i) => ({
              "@type": "ListItem",
              "position": i + 1,
              "name": h
            }))
          }
        }));
        const script = document.createElement('script');
        script.type = 'application/ld+json';
        script.textContent = JSON.stringify(schema);
        document.head.appendChild(script);
      }
    });
  </script>
</body>
</html>
