[build]
  publish = "."
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

# Scheduled functions — DISABLED until owner enables.
# Each function checks ai-staff/registry.json `schedulesEnabled` before running anything.
# To enable: set schedulesEnabled=true in registry.json AND uncomment the schedule lines below.

[functions]
  node_bundler = "esbuild"

# [functions."ai-staff-tick"]
#   schedule = "0 * * * *"   # hourly tick — orchestrator picks which agents are due

# --- Coming-soon gate ---
# Controlled by the LAUNCH_MODE env var on Netlify.
#   LAUNCH_MODE=coming-soon (default) → gate active
#   LAUNCH_MODE=live                  → full site is public
[[edge_functions]]
  function = "coming-soon-gate"
  path = "/*"

# --- API / function proxies ---
[[redirects]]
  from = "/api/ai-staff/status"
  to = "/.netlify/functions/ai-staff-status"
  status = 200

[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/runtime-config"
  status = 200

[[redirects]]
  from = "/api/submit-itinerary"
  to = "/.netlify/functions/submit-itinerary"
  status = 200

[[redirects]]
  from = "/api/get-itinerary"
  to = "/.netlify/functions/get-itinerary"
  status = 200

# --- Pretty URLs for the launch pages (self-gated by feature flags) ---
[[redirects]]
  from = "/gift"
  to = "/gift.html"
  status = 200

[[redirects]]
  from = "/partners"
  to = "/partners.html"
  status = 200

[[redirects]]
  from = "/share-trip"
  to = "/share-trip.html"
  status = 200

[[redirects]]
  from = "/coming-soon"
  to = "/coming-soon.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/musical-london-trip"
  to = "/musical-london-trip.html"
  status = 200

# --- Legacy blog URL redirects (post moved from /blog/ to root) ---
[[redirects]]
  from = "/blog/blog-hot-spring-that-doesnt-exist"
  to = "/blog-hot-spring-that-doesnt-exist.html"
  status = 301

[[redirects]]
  from = "/blog/blog-hot-spring-that-doesnt-exist.html"
  to = "/blog-hot-spring-that-doesnt-exist.html"
  status = 301

# 404 fallback — must stay last.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
