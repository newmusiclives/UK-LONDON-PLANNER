[build]
  publish = "."
  functions = "netlify/functions"

# Scheduled functions — DISABLED until owner enables.
# Each function checks ai-staff/registry.json `schedulesEnabled` before running anything.
# To enable: set schedulesEnabled=true in registry.json AND uncomment the schedule lines below.

[functions]
  node_bundler = "esbuild"

# [functions."ai-staff-tick"]
#   schedule = "0 * * * *"   # hourly tick — orchestrator picks which agents are due

# --- API / function proxies ---
[[redirects]]
  from = "/api/ai-staff/status"
  to = "/.netlify/functions/ai-staff-status"
  status = 200

[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/runtime-config"
  status = 200

# --- COMING-SOON GATE ---
# To relaunch the full site, delete every rule in this block.
# Allowed paths pass through (status 200 rewrites to themselves = serve the file).

[[redirects]]
  from = "/css/*"
  to = "/css/:splat"
  status = 200

[[redirects]]
  from = "/js/*"
  to = "/js/:splat"
  status = 200

[[redirects]]
  from = "/images/*"
  to = "/images/:splat"
  status = 200

[[redirects]]
  from = "/icons/*"
  to = "/icons/:splat"
  status = 200

[[redirects]]
  from = "/data/*"
  to = "/data/:splat"
  status = 200

[[redirects]]
  from = "/downloads/*"
  to = "/downloads/:splat"
  status = 200

[[redirects]]
  from = "/admin.html"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Launch pages — each self-gates via its own feature flag.
# They're allowed through the coming-soon gate so previews/marketing links work.
[[redirects]]
  from = "/gift.html"
  to = "/gift.html"
  status = 200

[[redirects]]
  from = "/gift"
  to = "/gift.html"
  status = 200

[[redirects]]
  from = "/partners.html"
  to = "/partners.html"
  status = 200

[[redirects]]
  from = "/partners"
  to = "/partners.html"
  status = 200

[[redirects]]
  from = "/share-trip.html"
  to = "/share-trip.html"
  status = 200

[[redirects]]
  from = "/share-trip"
  to = "/share-trip.html"
  status = 200

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200

[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/og-image.svg"
  to = "/og-image.svg"
  status = 200

# Everything else → the coming-soon page. Force (!) so existing
# .html files don't bypass the gate via static-file shadowing.
[[redirects]]
  from = "/*"
  to = "/"
  status = 302
  force = true

# --- END COMING-SOON GATE ---

# 404 fallback — must stay last.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
