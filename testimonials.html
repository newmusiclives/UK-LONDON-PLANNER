<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Your Experience — London & UK Planner</title>
  <meta name="description" content="Tell us about your London trip! Share your experience and help future travellers plan their perfect London adventure.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="header" id="site-header"></header>
  <main class="main" id="main-content">
    <section class="section section--dark" style="text-align:center;padding:4rem 0;">
      <div class="container">
        <h1 style="color:white;">Share Your London Experience</h1>
        <div class="divider"></div>
        <p style="color:rgba(255,255,255,0.8);max-width:620px;margin:0 auto;">Help future travellers by sharing your trip highlights, tips, and honest feedback</p>
      </div>
    </section>

    <section class="section">
      <div class="container" style="max-width:700px;">

        <!-- Testimonial Form -->
        <div class="card" style="margin-bottom:2rem;">
          <div class="card__body" style="padding:2rem;">
            <h2 style="margin-bottom:0.5rem;">Write Your Review</h2>
            <p style="color:var(--color-text-muted);margin-bottom:2rem;">Your review helps us improve and helps other travellers plan their trips.</p>

            <form id="testimonial-form">
              <!-- Name -->
              <div style="margin-bottom:1.5rem;">
                <label style="display:block;font-weight:600;margin-bottom:0.5rem;">Your Name *</label>
                <input type="text" id="test-name" required placeholder="e.g. Sarah M." style="width:100%;padding:0.75rem 1rem;border:2px solid var(--color-border);border-radius:var(--radius-md);font-size:0.95rem;font-family:inherit;">
              </div>

              <!-- Where From -->
              <div style="margin-bottom:1.5rem;">
                <label style="display:block;font-weight:600;margin-bottom:0.5rem;">Where are you from? *</label>
                <input type="text" id="test-location" required placeholder="e.g. Melbourne, Australia" style="width:100%;padding:0.75rem 1rem;border:2px solid var(--color-border);border-radius:var(--radius-md);font-size:0.95rem;font-family:inherit;">
              </div>

              <!-- Trip Details -->
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem;">
                <div>
                  <label style="display:block;font-weight:600;margin-bottom:0.5rem;">Trip Length</label>
                  <select id="test-days" style="width:100%;padding:0.75rem 1rem;border:2px solid var(--color-border);border-radius:var(--radius-md);font-size:0.95rem;font-family:inherit;">
                    <option value="">Select</option>
                    <option value="1-3">1-3 days</option>
                    <option value="4-5">4-5 days</option>
                    <option value="6-7">6-7 days</option>
                    <option value="8-14">8-14 days</option>
                    <option value="15+">15+ days</option>
                  </select>
                </div>
                <div>
                  <label style="display:block;font-weight:600;margin-bottom:0.5rem;">When did you visit?</label>
                  <input type="month" id="test-visit-date" style="width:100%;padding:0.75rem 1rem;border:2px solid var(--color-border);border-radius:var(--radius-md);font-size:0.95rem;font-family:inherit;">
                </div>
              </div>

              <!-- Overall Rating -->
              <div style="margin-bottom:1.5rem;">
                <label style="display:block;font-weight:600;margin-bottom:0.5rem;">Overall Rating *</label>
                <div id="test-stars" style="display:flex;gap:8px;cursor:pointer;">
                  <span data-r="1" style="font-size:2.5rem;color:#E5E1D8;transition:color 0.2s;" onmouseover="hoverTestStar(1)" onclick="selectTestStar(1)">★</span>
                  <span data-r="2" style="font-size:2.5rem;color:#E5E1D8;transition:color 0.2s;" onmouseover="hoverTestStar(2)" onclick="selectTestStar(2)">★</span>
                  <span data-r="3" style="font-size:2.5rem;color:#E5E1D8;transition:color 0.2s;" onmouseover="hoverTestStar(3)" onclick="selectTestStar(3)">★</span>
                  <span data-r="4" style="font-size:2.5rem;color:#E5E1D8;transition:color 0.2s;" onmouseover="hoverTestStar(4)" onclick="selectTestStar(4)">★</span>
                  <span data-r="5" style="font-size:2.5rem;color:#E5E1D8;transition:color 0.2s;" onmouseover="hoverTestStar(5)" onclick="selectTestStar(5)">★</span>
                </div>
                <input type="hidden" id="test-rating" value="0">
              </div>

              <!-- What did you love? -->
              <div style="margin-bottom:1.5rem;">
                <label style="display:block;font-weight:600;margin-bottom:0.5rem;">What did you love most? *</label>
                <textarea id="test-highlight" required rows="3" placeholder="Tell us about your favourite moments, places, or experiences..." style="width:100%;padding:0.75rem 1rem;border:2px solid var(--color-border);border-radius:var(--radius-md);font-size:0.95rem;font-family:inherit;resize:vertical;"></textarea>
              </div>

              <!-- Tips for others -->
              <div style="margin-bottom:1.5rem;">
                <label style="display:block;font-weight:600;margin-bottom:0.5rem;">Any tips for future visitors?</label>
                <textarea id="test-tips" rows="2" placeholder="e.g. Book restaurants in advance, use contactless on the Tube..." style="width:100%;padding:0.75rem 1rem;border:2px solid var(--color-border);border-radius:var(--radius-md);font-size:0.95rem;font-family:inherit;resize:vertical;"></textarea>
              </div>

              <!-- Did you use our itinerary? -->
              <div style="margin-bottom:1.5rem;">
                <label style="display:block;font-weight:600;margin-bottom:0.5rem;">Did you use our itinerary planner?</label>
                <div style="display:flex;gap:1rem;">
                  <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;">
                    <input type="radio" name="used-planner" value="yes"> Yes, it was great!
                  </label>
                  <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;">
                    <input type="radio" name="used-planner" value="no"> No, just browsing
                  </label>
                </div>
              </div>

              <!-- Photo permission -->
              <div style="margin-bottom:1.5rem;">
                <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;">
                  <input type="checkbox" id="test-permission" checked>
                  <span style="font-size:0.85rem;">I'm happy for my review to be displayed on the site</span>
                </label>
              </div>

              <!-- Email (optional) -->
              <div style="margin-bottom:2rem;">
                <label style="display:block;font-weight:600;margin-bottom:0.5rem;">Email (optional)</label>
                <input type="email" id="test-email" placeholder="For follow-up only — never published" style="width:100%;padding:0.75rem 1rem;border:2px solid var(--color-border);border-radius:var(--radius-md);font-size:0.95rem;font-family:inherit;">
                <p style="font-size:0.75rem;color:var(--color-text-muted);margin-top:0.25rem;">We may reach out if we'd like to feature your story</p>
              </div>

              <button type="submit" class="btn btn--primary btn--large btn--full" id="test-submit">Submit Your Review</button>
            </form>
          </div>
        </div>

        <!-- Recent Testimonials -->
        <div style="margin-top:3rem;">
          <h3 style="margin-bottom:1.5rem;">Recent Reviews</h3>
          <div id="recent-testimonials"></div>
        </div>

      </div>
    </section>
  </main>
  <footer class="footer" id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/env-bridge.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/accounts.js"></script>
  <script>
    const TESTIMONIALS_KEY = 'londonPlannerTestimonials';

    // Pre-seeded testimonials
    const seedTestimonials = [
      { name: 'Sarah M.', location: 'Melbourne, Australia', rating: 5, highlight: 'The itinerary was spot on! Every restaurant recommendation was brilliant, especially Padella and Dishoom. The neighbourhood guide for Shoreditch led us to amazing street art we never would have found.', days: '6-7', visitDate: '2024-10', usedPlanner: 'yes' },
      { name: 'James & Emily', location: 'Toronto, Canada', rating: 5, highlight: 'Planned our honeymoon with the planner and it was perfect. The romantic restaurant picks were incredible — Rules was the highlight of our trip. The interactive map made navigating so easy.', days: '8-14', visitDate: '2024-09', usedPlanner: 'yes' },
      { name: 'David R.', location: 'New York, USA', rating: 4, highlight: 'Great value for money. The hidden gems section showed us places no guidebook mentions. Postman\'s Park and Neal\'s Yard were magical. Only wish there were more nightlife recommendations for East London.', days: '4-5', visitDate: '2024-11', usedPlanner: 'yes' },
      { name: 'The Martinez Family', location: 'Madrid, Spain', rating: 5, highlight: 'Travelling with 3 kids aged 5-12, this planner was a lifesaver. Every activity was age-appropriate and the family restaurant picks actually had good food AND happy children. The Science Museum day was perfection.', days: '6-7', visitDate: '2024-08', usedPlanner: 'yes' },
      { name: 'Sophie L.', location: 'Sydney, Australia', rating: 5, highlight: 'As a solo female traveller, I felt completely confident following this itinerary. The safety tips were reassuring and the pub quiz recommendations helped me meet lovely people. Borough Market on a quiet Wednesday was chef\'s kiss.', days: '4-5', visitDate: '2024-10', usedPlanner: 'yes' }
    ];

    function getTestimonials() {
      try {
        const stored = localStorage.getItem(TESTIMONIALS_KEY);
        const user = stored ? JSON.parse(stored) : [];
        return [...seedTestimonials, ...user];
      } catch { return [...seedTestimonials]; }
    }

    function renderStars(rating) {
      return Array.from({length:5}, (_, i) =>
        `<span style="color:${i < rating ? 'var(--color-accent)' : '#E5E1D8'};">★</span>`
      ).join('');
    }

    function renderTestimonials() {
      const container = document.getElementById('recent-testimonials');
      const testimonials = getTestimonials();

      container.innerHTML = testimonials.map(t => `
        <div class="card" style="margin-bottom:1rem;">
          <div class="card__body">
            <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:0.75rem;">
              <div>
                <strong>${t.name}</strong>
                <span style="color:var(--color-text-muted);font-size:0.85rem;"> · ${t.location}</span>
              </div>
              <div style="font-size:1.1rem;">${renderStars(t.rating)}</div>
            </div>
            <p style="font-style:italic;color:var(--color-text);line-height:1.7;margin-bottom:0.5rem;">"${t.highlight}"</p>
            <div style="font-size:0.8rem;color:var(--color-text-muted);">
              ${t.days ? t.days + ' day trip' : ''} ${t.visitDate ? ' · Visited ' + t.visitDate : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    // Star rating interaction
    let selectedRating = 0;
    function hoverTestStar(n) {
      document.querySelectorAll('#test-stars span').forEach((s, i) => {
        s.style.color = i < n ? 'var(--color-accent)' : '#E5E1D8';
      });
    }
    function selectTestStar(n) {
      selectedRating = n;
      document.getElementById('test-rating').value = n;
      hoverTestStar(n);
    }

    document.addEventListener('DOMContentLoaded', () => {
      UI.init();
      renderTestimonials();

      document.getElementById('testimonial-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const rating = parseInt(document.getElementById('test-rating').value);
        if (!rating) { alert('Please select a star rating'); return; }

        const testimonial = {
          name: document.getElementById('test-name').value.trim(),
          location: document.getElementById('test-location').value.trim(),
          rating,
          highlight: document.getElementById('test-highlight').value.trim(),
          tips: document.getElementById('test-tips').value.trim(),
          days: document.getElementById('test-days').value,
          visitDate: document.getElementById('test-visit-date').value,
          usedPlanner: document.querySelector('input[name="used-planner"]:checked')?.value || '',
          email: document.getElementById('test-email').value.trim(),
          permission: document.getElementById('test-permission').checked,
          submittedAt: new Date().toISOString()
        };

        // Save locally
        try {
          const stored = localStorage.getItem(TESTIMONIALS_KEY);
          const list = stored ? JSON.parse(stored) : [];
          list.unshift(testimonial);
          localStorage.setItem(TESTIMONIALS_KEY, JSON.stringify(list));
        } catch {}

        // Send to GHL
        if (typeof GHL !== 'undefined') {
          await GHL.sendToWebhook('contactForm', {
            type: 'testimonial_submission',
            tags: ['london-planner', 'testimonial'],
            ...testimonial
          });
        }

        const btn = document.getElementById('test-submit');
        btn.textContent = 'Thank you!';
        btn.disabled = true;
        UI.showToast('Review submitted — thank you!');
        renderTestimonials();

        setTimeout(() => { btn.textContent = 'Submit Your Review'; btn.disabled = false; }, 3000);
        e.target.reset();
        selectedRating = 0;
        hoverTestStar(0);
      });
    });
  </script>
</body>
</html>
