<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1a30"/>
      <stop offset="50%" style="stop-color:#1B2A4A"/>
      <stop offset="100%" style="stop-color:#243759"/>
    </linearGradient>
    <linearGradient id="skyline-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A84C;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#C9A84C;stop-opacity:0.04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect x="16" y="16" width="1168" height="598" rx="10" fill="none" stroke="#C9A84C" stroke-width="1.5" opacity="0.4"/>

  <!-- London skyline silhouettes -->
  <g opacity="0.22" fill="#C9A84C">

    <!-- Left buildings cluster -->
    <rect x="60" y="400" width="44" height="100" rx="2"/>
    <rect x="112" y="370" width="36" height="130" rx="2"/>
    <rect x="156" y="410" width="50" height="90" rx="2"/>
    <rect x="214" y="385" width="32" height="115" rx="2"/>

    <!-- Big Ben -->
    <rect x="290" y="260" width="32" height="240" rx="2"/>
    <rect x="282" y="245" width="48" height="20" rx="3"/>
    <polygon points="306,245 290,225 322,225"/>
    <polygon points="306,225 300,200 312,200"/>
    <rect x="303" y="192" width="6" height="16"/>
    <!-- Clock face -->
    <circle cx="306" cy="290" r="12" fill="none" stroke="#C9A84C" stroke-width="1.5"/>
    <line x1="306" y1="290" x2="306" y2="282" stroke="#C9A84C" stroke-width="1.2"/>
    <line x1="306" y1="290" x2="312" y2="290" stroke="#C9A84C" stroke-width="1.2"/>

    <!-- Westminster-style buildings -->
    <rect x="330" y="350" width="60" height="150" rx="2"/>
    <rect x="340" y="335" width="14" height="20" rx="1"/>
    <rect x="362" y="330" width="14" height="25" rx="1"/>

    <!-- Tower Bridge -->
    <rect x="440" y="300" width="30" height="200" rx="2"/>
    <rect x="434" y="285" width="42" height="20" rx="3"/>
    <polygon points="455,285 440,268 470,268"/>
    <rect x="580" y="300" width="30" height="200" rx="2"/>
    <rect x="574" y="285" width="42" height="20" rx="3"/>
    <polygon points="595,285 580,268 610,268"/>
    <!-- Bridge deck -->
    <rect x="470" y="370" width="110" height="12" rx="2"/>
    <!-- Upper walkway -->
    <rect x="470" y="320" width="110" height="8" rx="2"/>
    <!-- Suspension cables -->
    <line x1="470" y1="300" x2="470" y2="370" stroke="#C9A84C" stroke-width="2"/>
    <line x1="525" y1="300" x2="525" y2="370" stroke="#C9A84C" stroke-width="2"/>
    <line x1="580" y1="300" x2="580" y2="370" stroke="#C9A84C" stroke-width="2"/>

    <!-- London Eye -->
    <circle cx="730" cy="340" r="110" fill="none" stroke="#C9A84C" stroke-width="4"/>
    <circle cx="730" cy="340" r="105" fill="none" stroke="#C9A84C" stroke-width="0.8"/>
    <!-- Eye spokes -->
    <line x1="730" y1="230" x2="730" y2="450" stroke="#C9A84C" stroke-width="1.5"/>
    <line x1="620" y1="340" x2="840" y2="340" stroke="#C9A84C" stroke-width="1.5"/>
    <line x1="652" y1="262" x2="808" y2="418" stroke="#C9A84C" stroke-width="1"/>
    <line x1="808" y1="262" x2="652" y2="418" stroke="#C9A84C" stroke-width="1"/>
    <!-- Eye pods (small circles) -->
    <circle cx="730" cy="230" r="6"/>
    <circle cx="730" cy="450" r="6"/>
    <circle cx="620" cy="340" r="6"/>
    <circle cx="840" cy="340" r="6"/>
    <circle cx="652" cy="262" r="5"/>
    <circle cx="808" cy="262" r="5"/>
    <circle cx="652" cy="418" r="5"/>
    <circle cx="808" cy="418" r="5"/>
    <!-- Eye support -->
    <line x1="730" y1="450" x2="730" y2="500" stroke="#C9A84C" stroke-width="5"/>

    <!-- The Shard -->
    <polygon points="900,500 885,500 892,210 893,210"/>
    <polygon points="900,500 915,500 908,210 907,210"/>
    <line x1="892" y1="300" x2="908" y2="300" stroke="#C9A84C" stroke-width="1"/>
    <line x1="890" y1="360" x2="910" y2="360" stroke="#C9A84C" stroke-width="1"/>
    <line x1="887" y1="420" x2="913" y2="420" stroke="#C9A84C" stroke-width="1"/>

    <!-- Right buildings cluster -->
    <rect x="950" y="380" width="42" height="120" rx="2"/>
    <rect x="1000" y="350" width="36" height="150" rx="2"/>
    <rect x="1044" y="390" width="48" height="110" rx="2"/>
    <rect x="1100" y="365" width="40" height="135" rx="2"/>
  </g>

  <!-- Ground line -->
  <rect x="0" y="498" width="1200" height="132" fill="#0f1a30" opacity="0.6"/>
  <line x1="40" y1="500" x2="1160" y2="500" stroke="#C9A84C" stroke-width="1" opacity="0.3"/>

  <!-- Decorative top accent line -->
  <line x1="300" y1="100" x2="900" y2="100" stroke="#C9A84C" stroke-width="1.5" opacity="0.35"/>

  <!-- Main title -->
  <text x="600" y="195" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="68" font-weight="bold" fill="white" letter-spacing="1">UK &amp; London Planned</text>

  <!-- Decorative divider -->
  <line x1="380" y1="225" x2="820" y2="225" stroke="#C9A84C" stroke-width="2" opacity="0.6"/>
  <circle cx="600" cy="225" r="4" fill="#C9A84C" opacity="0.6"/>
  <circle cx="380" cy="225" r="2.5" fill="#C9A84C" opacity="0.4"/>
  <circle cx="820" cy="225" r="2.5" fill="#C9A84C" opacity="0.4"/>

  <!-- Tagline -->
  <text x="600" y="275" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="28" fill="#C9A84C" font-style="italic">Your Perfect London Trip, Curated by Experts</text>

  <!-- Bottom info bar -->
  <rect x="250" y="540" width="700" height="50" rx="25" fill="#C9A84C" opacity="0.15"/>
  <rect x="250" y="540" width="700" height="50" rx="25" fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.3"/>
  <text x="600" y="572" text-anchor="middle" font-family="Arial, 'Inter', sans-serif" font-size="20" fill="white" font-weight="600" letter-spacing="2">From $50  |  2,000+ Venues  |  Personalised Itineraries</text>
</svg>
