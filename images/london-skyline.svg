<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#2A3F6B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#E8D5A0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <circle cx="100" cy="50" r="1.5" fill="#E8D5A0" opacity="0.6"/>
  <circle cx="250" cy="80" r="1" fill="#E8D5A0" opacity="0.4"/>
  <circle cx="400" cy="30" r="1.5" fill="#E8D5A0" opacity="0.5"/>
  <circle cx="550" cy="70" r="1" fill="#E8D5A0" opacity="0.3"/>
  <circle cx="700" cy="40" r="1.5" fill="#E8D5A0" opacity="0.6"/>
  <circle cx="850" cy="60" r="1" fill="#E8D5A0" opacity="0.4"/>
  <circle cx="1000" cy="35" r="1.5" fill="#E8D5A0" opacity="0.5"/>
  <circle cx="1100" cy="75" r="1" fill="#E8D5A0" opacity="0.3"/>

  <!-- Moon -->
  <circle cx="950" cy="80" r="25" fill="#E8D5A0" opacity="0.15"/>
  <circle cx="958" cy="74" r="22" fill="url(#sky)"/>

  <!-- Thames -->
  <rect x="0" y="330" width="1200" height="70" fill="#162238" opacity="0.8"/>
  <path d="M0 335 Q300 325 600 340 Q900 355 1200 330 L1200 400 L0 400Z" fill="#0f1a30" opacity="0.5"/>

  <!-- Big Ben / Elizabeth Tower -->
  <rect x="180" y="140" width="25" height="190" fill="#2A3F6B" stroke="#C9A84C" stroke-width="0.5"/>
  <rect x="175" y="130" width="35" height="15" fill="#2A3F6B" stroke="#C9A84C" stroke-width="0.5"/>
  <polygon points="192,80 185,130 200,130" fill="#2A3F6B" stroke="#C9A84C" stroke-width="0.5"/>
  <line x1="192" y1="80" x2="192" y2="65" stroke="#C9A84C" stroke-width="1"/>
  <!-- Clock face -->
  <circle cx="192" cy="165" r="10" fill="none" stroke="#C9A84C" stroke-width="1"/>
  <circle cx="192" cy="165" r="1.5" fill="#C9A84C"/>
  <!-- Windows -->
  <rect x="186" y="200" width="4" height="6" fill="#C9A84C" opacity="0.3"/>
  <rect x="194" y="200" width="4" height="6" fill="#C9A84C" opacity="0.3"/>
  <rect x="186" y="220" width="4" height="6" fill="#C9A84C" opacity="0.2"/>
  <rect x="194" y="220" width="4" height="6" fill="#C9A84C" opacity="0.2"/>

  <!-- Parliament -->
  <rect x="210" y="230" width="120" height="100" fill="#2A3F6B" stroke="#C9A84C" stroke-width="0.5"/>
  <rect x="215" y="220" width="110" height="15" fill="#2A3F6B" stroke="#C9A84C" stroke-width="0.5"/>
  <!-- Parliament windows -->
  <rect x="220" y="250" width="8" height="10" fill="#C9A84C" opacity="0.2"/>
  <rect x="235" y="250" width="8" height="10" fill="#C9A84C" opacity="0.3"/>
  <rect x="250" y="250" width="8" height="10" fill="#C9A84C" opacity="0.2"/>
  <rect x="265" y="250" width="8" height="10" fill="#C9A84C" opacity="0.3"/>
  <rect x="280" y="250" width="8" height="10" fill="#C9A84C" opacity="0.2"/>
  <rect x="295" y="250" width="8" height="10" fill="#C9A84C" opacity="0.3"/>
  <rect x="310" y="250" width="8" height="10" fill="#C9A84C" opacity="0.2"/>

  <!-- London Eye -->
  <circle cx="500" cy="220" r="90" fill="none" stroke="#C9A84C" stroke-width="1.5" opacity="0.6"/>
  <circle cx="500" cy="220" r="85" fill="none" stroke="#C9A84C" stroke-width="0.5" opacity="0.3"/>
  <line x1="500" y1="310" x2="500" y2="330" stroke="#C9A84C" stroke-width="2" opacity="0.6"/>
  <line x1="485" y1="325" x2="515" y2="325" stroke="#C9A84C" stroke-width="1.5" opacity="0.6"/>
  <!-- Capsules -->
  <ellipse cx="500" cy="130" rx="4" ry="6" fill="#C9A84C" opacity="0.3"/>
  <ellipse cx="560" cy="152" rx="4" ry="6" fill="#C9A84C" opacity="0.3" transform="rotate(25 560 152)"/>
  <ellipse cx="588" cy="210" rx="4" ry="6" fill="#C9A84C" opacity="0.3" transform="rotate(60 588 210)"/>
  <ellipse cx="440" cy="152" rx="4" ry="6" fill="#C9A84C" opacity="0.3" transform="rotate(-25 440 152)"/>
  <ellipse cx="412" cy="210" rx="4" ry="6" fill="#C9A84C" opacity="0.3" transform="rotate(-60 412 210)"/>

  <!-- The Shard -->
  <polygon points="700,80 685,330 715,330" fill="#2A3F6B" stroke="#C9A84C" stroke-width="0.5"/>
  <line x1="690" y1="200" x2="710" y2="200" stroke="#C9A84C" stroke-width="0.3" opacity="0.4"/>
  <line x1="688" y1="250" x2="712" y2="250" stroke="#C9A84C" stroke-width="0.3" opacity="0.4"/>
  <line x1="692" y1="150" x2="708" y2="150" stroke="#C9A84C" stroke-width="0.3" opacity="0.4"/>

  <!-- Tower Bridge -->
  <rect x="830" y="200" width="20" height="130" fill="#2A3F6B" stroke="#C9A84C" stroke-width="0.5"/>
  <rect x="920" y="200" width="20" height="130" fill="#2A3F6B" stroke="#C9A84C" stroke-width="0.5"/>
  <!-- Bridge top connector -->
  <rect x="850" y="215" width="70" height="8" fill="#2A3F6B" stroke="#C9A84C" stroke-width="0.5"/>
  <rect x="850" y="235" width="70" height="8" fill="#2A3F6B" stroke="#C9A84C" stroke-width="0.5"/>
  <!-- Bridge road -->
  <rect x="830" y="290" width="110" height="10" fill="#2A3F6B" stroke="#C9A84C" stroke-width="0.5"/>
  <!-- Turrets -->
  <rect x="828" y="190" width="24" height="15" fill="#2A3F6B" stroke="#C9A84C" stroke-width="0.5"/>
  <polygon points="830,190 840,175 850,190" fill="#2A3F6B" stroke="#C9A84C" stroke-width="0.5"/>
  <rect x="918" y="190" width="24" height="15" fill="#2A3F6B" stroke="#C9A84C" stroke-width="0.5"/>
  <polygon points="920,190 930,175 940,190" fill="#2A3F6B" stroke="#C9A84C" stroke-width="0.5"/>

  <!-- St Paul's Dome -->
  <rect x="1020" y="250" width="80" height="80" fill="#2A3F6B" stroke="#C9A84C" stroke-width="0.5"/>
  <ellipse cx="1060" cy="250" rx="35" ry="20" fill="#2A3F6B" stroke="#C9A84C" stroke-width="0.5"/>
  <path d="M1035 250 Q1060 200 1085 250" fill="#2A3F6B" stroke="#C9A84C" stroke-width="0.5"/>
  <rect x="1055" y="195" width="10" height="15" fill="#2A3F6B" stroke="#C9A84C" stroke-width="0.5"/>
  <circle cx="1060" cy="192" r="5" fill="none" stroke="#C9A84C" stroke-width="0.5"/>
  <line x1="1060" y1="187" x2="1060" y2="178" stroke="#C9A84C" stroke-width="1"/>
  <!-- Columns -->
  <rect x="1030" y="260" width="3" height="20" fill="#C9A84C" opacity="0.3"/>
  <rect x="1040" y="260" width="3" height="20" fill="#C9A84C" opacity="0.3"/>
  <rect x="1075" y="260" width="3" height="20" fill="#C9A84C" opacity="0.3"/>
  <rect x="1085" y="260" width="3" height="20" fill="#C9A84C" opacity="0.3"/>

  <!-- Generic buildings background -->
  <rect x="0" y="280" width="50" height="50" fill="#1a2744" opacity="0.7"/>
  <rect x="55" y="260" width="40" height="70" fill="#1a2744" opacity="0.5"/>
  <rect x="100" y="270" width="35" height="60" fill="#1a2744" opacity="0.6"/>
  <rect x="340" y="270" width="40" height="60" fill="#1a2744" opacity="0.5"/>
  <rect x="390" y="285" width="30" height="45" fill="#1a2744" opacity="0.6"/>
  <rect x="600" y="260" width="35" height="70" fill="#1a2744" opacity="0.5"/>
  <rect x="640" y="275" width="30" height="55" fill="#1a2744" opacity="0.6"/>
  <rect x="750" y="280" width="35" height="50" fill="#1a2744" opacity="0.5"/>
  <rect x="790" y="270" width="25" height="60" fill="#1a2744" opacity="0.6"/>
  <rect x="1110" y="260" width="40" height="70" fill="#1a2744" opacity="0.5"/>
  <rect x="1155" y="275" width="45" height="55" fill="#1a2744" opacity="0.6"/>

  <!-- Water reflections -->
  <line x1="150" y1="350" x2="200" y2="350" stroke="#C9A84C" stroke-width="0.5" opacity="0.15"/>
  <line x1="400" y1="360" x2="480" y2="360" stroke="#C9A84C" stroke-width="0.5" opacity="0.1"/>
  <line x1="600" y1="355" x2="650" y2="355" stroke="#C9A84C" stroke-width="0.5" opacity="0.15"/>
  <line x1="800" y1="345" x2="900" y2="345" stroke="#C9A84C" stroke-width="0.5" opacity="0.1"/>
  <line x1="1000" y1="360" x2="1080" y2="360" stroke="#C9A84C" stroke-width="0.5" opacity="0.15"/>
</svg>
